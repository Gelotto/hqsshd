name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Both release platforms: procscan, shell resolution, and PTY handling
    # have platform-specific code that only real linux/darwin runs exercise.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4 # Pin to SHA in production

      - name: Set up Go
        uses: actions/setup-go@v5 # Pin to SHA in production
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...
