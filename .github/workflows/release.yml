name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    # darwin builds run on a macOS runner so the binaries can be ad-hoc
    # codesigned with stable identifiers (launchd, TCC and Console then
    # show "com.gelotto.hqsshd" instead of the linker's "a.out"). Still not
    # Developer ID signed or notarized.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-X github.com/gelotto/hqsshd/internal/config.DaemonVersion=${VERSION} -X github.com/gelotto/hqsshd/internal/config.Commit=${COMMIT}"

          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o dist/hqsshd ./cmd/hqsshd
          go build -trimpath -ldflags "${LDFLAGS}" -o dist/hqssh ./cmd/hqssh

      - name: Codesign (darwin)
        if: matrix.goos == 'darwin'
        run: |
          codesign --force --sign - --identifier com.gelotto.hqsshd dist/hqsshd
          codesign --force --sign - --identifier com.gelotto.hqssh dist/hqssh
          codesign -dv dist/hqsshd 2>&1 | grep -q 'Identifier=com.gelotto.hqsshd'

      - name: Package
        run: |
          ARCHIVE="hqsshd-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          # COPYFILE_DISABLE keeps macOS tar from adding ._* AppleDouble entries
          COPYFILE_DISABLE=1 tar -czf "${ARCHIVE}" -C dist hqsshd hqssh
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hqsshd-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            hqsshd-*.tar.gz
            hqsshd-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums file
        run: |
          cd artifacts
          cat *.sha256 > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/hqsshd-*.tar.gz
            artifacts/checksums.txt
            scripts/install.sh
          body: |
            ## Quick Install

            ```bash
            curl -fsSL https://hqssh.com/install | sh
            ```

            Or pin this version:

            ```bash
            curl -fsSL https://hqssh.com/install | HQSSH_VERSION=${{ github.ref_name }} sh
            ```

            ## Manual Install

            Download the archive for your platform, extract, and move the binaries to your PATH:

            ```bash
            # Example for Linux amd64
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/hqsshd-linux-amd64.tar.gz
            tar xzf hqsshd-linux-amd64.tar.gz
            mv hqsshd hqssh ~/.local/bin/
            ```

            Verify installation:
            ```bash
            hqsshd --version
            ```
